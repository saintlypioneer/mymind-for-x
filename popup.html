<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>mymind for X</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2b2723;
      background: #faf6f0;
    }

    /* Warm ambient glow behind everything */
    .wrap {
      position: relative;
      padding: 24px 22px 22px;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 85% -10%, rgba(255, 138, 61, 0.28), transparent 60%),
        radial-gradient(110% 70% at -10% 110%, rgba(255, 196, 120, 0.22), transparent 55%),
        linear-gradient(180deg, #fdfaf5 0%, #f6efe4 100%);
    }

    .head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }
    .head img {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      box-shadow: 0 4px 12px rgba(255, 107, 44, 0.32);
    }
    .head h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .head .sub {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #9a8f80;
      margin-top: 1px;
    }

    /* Status card */
    .card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      backdrop-filter: blur(4px);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      background: #d8cbb8;
    }
    .dot.connected {
      background: #2fb87a;
      box-shadow: 0 0 0 3px rgba(47, 184, 122, 0.18);
    }
    .status {
      font-size: 12.5px;
      line-height: 1.45;
      color: #6b6155;
      margin: 0;
    }

    /* Login button — warm gradient pill */
    button {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: -0.01em;
      color: #fff;
      background: linear-gradient(135deg, #ff9d4d 0%, #ff6b2c 55%, #f5521d 100%);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245, 82, 29, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    button:hover {
      box-shadow: 0 8px 22px rgba(245, 82, 29, 0.45);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(245, 82, 29, 0.35);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <img src="icons/mymind-icon.png" alt="" />
      <h1>
        mymind for X
        <span class="sub">Save tweets to your mind</span>
      </h1>
    </div>

    <div class="card">
      <span class="dot" id="dot"></span>
      <p class="status" id="status">Checking…</p>
    </div>

    <button id="login" class="hidden">Log in to mymind</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
